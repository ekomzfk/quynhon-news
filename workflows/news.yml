name: news-bot

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"   # каждые 10 минут: кнопки; новости собираются раз в час
  workflow_dispatch:                      # кнопка «Run workflow» — сразу собирает новости

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_COLLECT: ${{ github.event_name == 'workflow_dispatch' }}

          RU_CHANNEL: "@Quynhon_news"
          EN_CHANNEL: ""
          ADMIN_CHAT_ID: "239292695"
          MODERATION: "1"
          MIN_SCORE: "6"
          MIN_SCORE_LOCAL: "3"
          MAX_POSTS_PER_RUN: "3"
          QUIET_HOURS: "23-7"
          MODEL: "claude-haiku-5-5"
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          [ -f state.json ] || exit 0
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
